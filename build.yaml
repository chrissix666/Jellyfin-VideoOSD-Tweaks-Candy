changelog: >
  2.0.0.0 (Jellyfin 12.1): First build for Jellyfin 12.1, same features as 1.1.0.0; the scripts support the new 12.1 video header.
  1.1.0.0 (Jellyfin 10.10.7): Speed keys step through your custom speed list, the settings menu shows custom speeds, browser back closes only the Customs menu, download links use ApiKey.
  1.0.1.0: Settings now apply for all users (not only admins), script tags stay up to date without File Transformation and are removed on uninstall, config page save fixes.
  1.0.0.0: Initial release.
